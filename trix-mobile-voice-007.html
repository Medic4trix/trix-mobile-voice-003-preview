<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; media-src blob:; img-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<title>Dr. TRIX — WebView compacto de qualificação</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}
html,body{width:100%;margin:0;overflow-x:hidden;background:#091711;color:#f0faf4}
main{width:100%;max-width:640px;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.status{border:1px solid #315847;border-radius:10px;background:#1a2e25;padding:8px 10px;font-size:12px;line-height:1.3;text-align:center}
.messages{height:clamp(80px,20vh,155px);overflow-y:auto;overscroll-behavior:contain;border:1px solid #315847;border-radius:12px;padding:7px;background:#10231c}
.bubble{padding:7px 9px;margin:5px 0;border-radius:10px;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.user{background:#265c4a;margin-left:12px}.bubble.bot{background:#2a3730;margin-right:12px}
.composer{display:flex;gap:6px;align-items:stretch}
textarea{flex:1;min-width:0;min-height:48px;height:48px;resize:vertical;border:1px solid #4a7160;border-radius:11px;background:#14251d;color:white;padding:8px;font:14px system-ui}
button{border:1px solid #517d69;border-radius:11px;background:#aee7d3;color:#0e241b;font:600 13px system-ui;min-height:44px;padding:7px 11px;cursor:pointer}
button.secondary{background:#1a2e25;color:#e8f8ee}button:disabled{opacity:.46;cursor:not-allowed}
#send{min-width:75px}.voice{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.utility{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.utility button{min-height:36px;padding:6px 9px;font-size:12px}
details{flex:1;min-width:150px;border:1px solid #315847;border-radius:10px;padding:7px 9px;font-size:12px}
summary{cursor:pointer;font-weight:600}
pre{font:11px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:110px;overflow-y:auto;background:#07140e;padding:7px;border-radius:7px}
audio{width:100%;height:30px}
.note{margin:0;color:#b7cfc2;font-size:11px;line-height:1.3;text-align:center}
@media(max-width:350px){main{padding:5px;gap:5px}button{padding:6px;font-size:12px}#send{min-width:63px}.messages{height:85px}}
</style></head><body><main aria-label="Interface compacta de conversa local Dr. TRIX">
<div class="status" id="status" role="status" aria-live="polite">Aguardando início do teste local</div>
<div class="messages" id="messages" role="log" aria-live="polite" aria-label="Mensagens sintéticas de teste"></div>
<div class="composer"><textarea id="draft" maxlength="500" placeholder="Mensagem fictícia de teste" aria-label="Mensagem de teste local"></textarea><button id="send">Enviar</button></div>
<div class="voice"><button id="start">🎙️ Testar voz</button><button id="stop" class="secondary" disabled>■ Encerrar voz</button></div>
<div class="utility"><button id="clear" class="secondary">Limpar chat</button><button id="copy" class="secondary">Copiar diagnóstico</button><details><summary>Diagnóstico</summary><pre id="log" role="log">Aguardando teste.</pre></details></div>
<audio id="remote" autoplay playsinline aria-label="Retorno de áudio local"></audio>
<p class="note">QUALIFICAÇÃO LOCAL · Sem IA, atendimento real, dados clínicos, envio ou cobrança. Use somente mensagens fictícias. Voz: máximo 20 segundos.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), logs=[];
let peerA=null,peerB=null,stream=null,timer=null,epoch=0,active=false;
function log(s){logs.push(s);$('log').textContent=logs.join('\n');}
function status(s){$('status').textContent=s;}
function release(reason){
 epoch++;if(timer!==null){clearTimeout(timer);timer=null;}
 if(peerA){peerA.close();peerA=null;}if(peerB){peerB.close();peerB=null;}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 $('remote').pause();$('remote').srcObject=null;
 active=false;$('start').disabled=false;$('stop').disabled=true;
 status('Teste encerrado. Microfone liberado.');log('SESSION_CLOSED '+reason);
}
function wire(pc,target){pc.onicecandidate=e=>{if(e.candidate&&target())target().addIceCandidate(e.candidate).catch(()=>log('ICE_CANDIDATE_ERROR'));};}
$('start').onclick=async()=>{
 if(active)return;
 if(!isSecureContext||!navigator.mediaDevices?.getUserMedia||typeof RTCPeerConnection!=='function'){status('WebRTC ou microfone indisponível neste contexto.');log('API_UNAVAILABLE');return;}
 active=true;$('start').disabled=true;$('stop').disabled=false;const id=++epoch;
 status('Solicitando microfone para teste local...');log('MICROPHONE_REQUEST');
 try{
 const acquired=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
 if(id!==epoch||document.visibilityState!=='visible'){acquired.getTracks().forEach(t=>t.stop());return;}
 stream=acquired;log('MICROPHONE_GRANTED');
 peerA=new RTCPeerConnection({iceServers:[]});peerB=new RTCPeerConnection({iceServers:[]});
 wire(peerA,()=>peerB);wire(peerB,()=>peerA);
 peerB.ontrack=e=>{if(id!==epoch)return;$('remote').srcObject=e.streams[0]||new MediaStream([e.track]);$('remote').play().then(()=>log('LOCAL_AUDIO_PLAYING')).catch(err=>log('PLAYBACK_BLOCKED '+err.name));log('REMOTE_TRACK_RECEIVED');};
 stream.getAudioTracks().forEach(t=>peerA.addTrack(t,stream));
 const offer=await peerA.createOffer();if(id!==epoch)return;
 await peerA.setLocalDescription(offer);if(id!==epoch)return;
 await peerB.setRemoteDescription(peerA.localDescription);if(id!==epoch)return;
 const answer=await peerB.createAnswer();if(id!==epoch)return;
 await peerB.setLocalDescription(answer);if(id!==epoch)return;
 await peerA.setRemoteDescription(peerB.localDescription);if(id!==epoch)return;
 log('LOCAL_SDP_EXCHANGED');log('REMOTE_PROVIDER_REQUESTS=0');
 status('Áudio local em teste. Fale e escute o retorno (máximo 20 s).');
 timer=setTimeout(()=>release('AUTO_STOP_20S'),20000);
 }catch(e){if(id!==epoch)return;log('ERROR '+e.name+': '+e.message);release('ERROR');}
};
$('stop').onclick=()=>release('MANUAL_STOP');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&active)release('BACKGROUND');});
window.addEventListener('pagehide',()=>{if(active)release('PAGEHIDE');});
$('copy').onclick=()=>navigator.clipboard.writeText(logs.join('\n')).catch(()=>log('COPY_UNAVAILABLE'));
log('TRIX_MOBILE_VOICE_003_READY');log('LOCAL_ONLY=true');log('EXTERNAL_REQUESTS=0');

// Chat local sintético: DOM textContent, sem rede, sem persistência e sem IA.
function appendBubble(kind,value){
 const item=document.createElement('div');item.className='bubble '+kind;item.textContent=value;
 $('messages').appendChild(item);$('messages').scrollTop=$('messages').scrollHeight;
}
$('send').onclick=()=>{
 const value=$('draft').value.trim();if(!value)return;
 appendBubble('user',value);$('draft').value='';
 appendBubble('bot','[RESPOSTA SIMULADA] Mensagem recebida apenas nesta página de teste. Nenhuma IA foi consultada.');
 log('LOCAL_TEXT_TEST_SENT');log('SIMULATED_REPLY_RENDERED');
};
$('clear').onclick=()=>{$('messages').replaceChildren();$('draft').value='';log('LOCAL_CHAT_CLEARED');};
</script></body></html>
